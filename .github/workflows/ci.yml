name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  PROJECT: HobbyHangar.xcodeproj
  SCHEME: HobbyHangar
  SIMULATOR: "iPhone 17"
  POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}

jobs:
  build-and-test:
    name: Build & Tests
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      
      - name: Install xcpretty
        run: gem install xcpretty

      - name: Inject PostHog API key into Info.plist
        run: |
          if [ -n "$POSTHOG_API_KEY" ]; then
            /usr/libexec/PlistBuddy -c "Set :POSTHOG_API_KEY \"$POSTHOG_API_KEY\"" "HobbyHangar/Info.plist"
            echo "POSTHOG_API_KEY set in Info.plist"
          else
            echo "POSTHOG_API_KEY not set, skipping injection"
          fi

      - name: Run unit + UI tests
        run: |
          set -o pipefail
          xcrun simctl shutdown all || true
          xcrun simctl erase all || true
          sudo pkill -9 com.apple.CoreSimulator.CoreSimulatorService || true
          sleep 2
          PARALLEL_WORKERS=$(sysctl -n hw.logicalcpu)
          if [ "$PARALLEL_WORKERS" -gt 4 ]; then PARALLEL_WORKERS=4; fi
          echo "Using $PARALLEL_WORKERS parallel workers for testing"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$SIMULATOR" \
            -skipPackagePluginValidation \
            -parallel-testing-enabled YES \
            -parallel-testing-worker-count "$PARALLEL_WORKERS" \
            clean test | xcpretty
    timeout-minutes: 45

  deploy-testflight:
    name: Deploy to TestFlight
    runs-on: macos-26
    needs: build-and-test
    if: github.event_name == 'push' && github.ref_name == 'main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Increment Build Number
        run: xcrun agvtool new-version ${{ github.run_number }}

      - name: Inject PostHog API key into Info.plist
        run: |
          if [ -n "$POSTHOG_API_KEY" ]; then
            /usr/libexec/PlistBuddy -c "Set :POSTHOG_API_KEY \"$POSTHOG_API_KEY\"" "HobbyHangar/Info.plist"
            echo "POSTHOG_API_KEY set in Info.plist"
          else
            echo "POSTHOG_API_KEY not set, skipping injection"
          fi

      - name: Build & Upload to TestFlight (fastlane)
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane beta
    timeout-minutes: 60